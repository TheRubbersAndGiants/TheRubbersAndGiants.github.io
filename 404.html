<!DOCTYPE html>
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style> @font-face {
  font-family: 'Latin CG Bold';
  src: url('fonts/fontw.woff2') format('woff2');
  font-weight: bold;
  font-style: normal;
  font-display: swap;
}

body {
  background-color: black; 
  color: white; 
  font-family: 'Latin CG Bold', sans-serif;
  margin: 20px; 
}

a {
  color: #00ff00;
  text-decoration: none;
  font-family: sans-serif;
  font-weight: bold;
  margin-right: 15px;
  border-bottom: 1px solid transparent;
  transition: all 0.2s ease-in-out;
  border-radius: 3px;
}

a:hover {
  color: white;
  border-bottom: 1px solid #00ff00;
}

h1, h2 {
  margin-top: 30px;
  font-family: 'Latin CG Bold', sans-serif;
  color: white;
}

strong {
  margin-top: 30px;
  font-family: 'Latin CG Bold', sans-serif;
  color: white;
}

h1, h2 {
  color: white;
  letter-spacing: 1px;
}
button {
  background-color: #002200;
  color: #00ff00;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
  outline: 1px solid white;
}

button:hover {
  color: white;
  border-bottom: 1px solid #00ff00;
  background-color: #004400;
} </style>
</head>

<body>
<h1 style="text-align: center;"> This page doesn't exist. What did you do to get here? </h1>
<p style="text-align: center;"> 404 Page not Found </p>
<a href="/"><button>Go Back</button></a>
</body>
